name: mental_smile_os
description: Mental Smile OS active runtime and Arabic-first mental health discovery ecosystem.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1

  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  firebase_storage: ^12.4.10

  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  flutter_tts: ^4.2.5
  image_picker: ^1.1.2
  firebase_analytics: ^11.6.0
  flutter_markdown: ^0.7.4
  markdown: ^7.2.2
  intl: any
  mental_smile_commercial_capsule:
    path: capsules/commercial/package
  mental_smile_library_capsule:
    path: capsules/library/package
  mental_smile_residential_capsule:
    path: capsules/residential/package

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/branding/logo_icon.png
