name: mental_smile_os
description: Mental Smile OS active runtime and Arabic-first mental health discovery ecosystem.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1

  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  firebase_storage: ^12.4.10

  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.13.4
  image_picker: ^1.1.2
  uuid: ^4.5.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  firebase_analytics: ^11.6.0
  flutter_markdown: ^0.7.4
  markdown: ^7.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

